<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Rooster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      
      /* TV Mode specifiek */
      .tv-mode-bg { background-color: #020617; }
      
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-in { 
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
      }

      /* Marquee voor afwezigen bovenin */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        display: inline-flex;
        animation: marquee 30s linear infinite;
        white-space: nowrap;
      }

      /* Verberg scrollbar maar behoud scroll functionaliteit */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Smooth scrolling voor overvolle kolommen */
      @keyframes scrollColumn {
        0%, 10% { transform: translateY(0); }
        90%, 100% { transform: translateY(var(--scroll-dist, 0)); }
      }
      .auto-scroll-content {
        animation: scrollColumn 20s ease-in-out infinite alternate;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
  </body>
</html>
