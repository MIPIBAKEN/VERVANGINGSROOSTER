<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Rooster Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      
      /* TV-Mode styling */
      .tv-mode::-webkit-scrollbar { display: none; }
      .tv-mode { -ms-overflow-style: none; scrollbar-width: none; cursor: none; }

      /* Print-specifieke styles voor PDF Export */
      @media print {
        nav, .no-print, button { display: none !important; }
        .print-only { display: block !important; }
        body { background: white !important; padding: 0 !important; color: black !important; }
        .main-content { padding: 0 !important; margin: 0 !important; width: 100% !important; }
        .shadow-xl, .shadow-sm, .rounded-3xl { box-shadow: none !important; border-radius: 0 !important; }
        @page { size: landscape; margin: 1cm; }
      }
      .print-only { display: none; }
      
      /* Custom scrollbar voor desktop */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
